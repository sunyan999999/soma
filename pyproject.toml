[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soma-wisdom"
version = "2.0.31"
description = "SOMA: Somatic Wisdom Architecture — Wisdom over Memory"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
    {name = "SOMA Project Team"}
]
keywords = ["agent", "memory", "wisdom", "llm", "rag", "cognitive"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "networkx>=3.0",
    # v2.0.8: 锁定 litellm 上界，避免 1.97.0 Pydantic 循环引用兼容错误（零熵智库 P3 反馈）
    "litellm>=1.96.2,<1.97.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "jieba>=0.42",
    "scikit-learn>=1.3.0",
    # v2.0.8: 锁定 fastembed 上界，避免 ONNX 推理延迟回归 4.4x
    "fastembed==0.7.4",
    "faiss-cpu>=1.8.0",
    "tenacity>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "pytest-timeout>=2.0",
    "ruff>=0.1",
    "mypy>=1.5",
]
alpha = [
    "langchain-core>=0.3.0",
    "streamlit>=1.40.0",
]

[project.urls]
Homepage = "https://github.com/sunyan999999/soma"
Repository = "https://github.com/sunyan999999/soma.git"
Issues = "https://github.com/sunyan999999/soma/issues"
Documentation = "https://sunyan999999.github.io/soma/"
PyPI = "https://pypi.org/project/soma-wisdom/"

[project.scripts]
soma = "soma.cli:main"
soma-quickstart = "soma.__main__:main"
soma-server = "soma.server:main"

[project.entry-points."soma.plugins"]
retriever = "soma.hub._retriever:MemoryRetriever"
scorer = "soma.hub._scorer:RelevanceScorer"
ranker = "soma.hub._ranker:MMRRanker"

[tool.hatch.build.targets.wheel]
packages = ["soma"]

# ── sdist 里该带什么（2026-10-23）────────────────────────────────
#
# ## 之前的问题
#
# 构建后端是 **hatchling**（不是 setuptools），所以仓库根目录的 `MANIFEST.in`
# **对它完全无效** —— 我加过一个，构建后内部文档照样在包里（实测发现）。
#
# 默认行为下 hatch 的 sdist 会把仓库里的**大部分文件**都收进去，包括：
#   · 10 份 `TEST_REPORT_v*.md`（某版本的测试快照）
#   · `QODER_TEST_HANDBOOK.md`（给特定协作方的测试手册）
#   · `docs/plan-*.md`（开发计划）
# 这些是**内部开发记录**，对一个装包的用户没有任何价值，
# 还会让人误以为它们是发布说明。
#
# ## 现在
#
# 显式声明 `include` 白名单 —— **只带使用者需要的东西**。
# `tests/` 保留：从 sdist 装的开发者应该能跑测试。
#
# ⚠️ 改这里之后必须**重新构建并核对**（`tar -tzf dist/*.tar.gz`），
#    不能只看构建成功。
[tool.hatch.build.targets.sdist]
include = [
  "soma/",
  "tests/",
  # 面向使用者的正式文档（v2.0.25 起）—— 排除规则见下方 exclude
  "docs/guides/",
  "README.md",
  "README_zh.md",
  "CHANGELOG.md",
  "LICENSE",
  "SECURITY.md",
  "CONTRIBUTING.md",
  "CODE_OF_CONDUCT.md",
  "ROADMAP.md",
  "API_STABILITY.md",
  "INTRO.md",
  "pyproject.toml",
]
exclude = [
  "TEST_REPORT_*.md",
  "QODER_TEST_HANDBOOK.md",
  "docs/plan-*.md",
  "docs/*研究笔记.md",
  "docs/pi-*.md",
  "dist/",
  "build/",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
